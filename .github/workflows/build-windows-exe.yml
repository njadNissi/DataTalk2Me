name: Build Streamlit Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5  # Also Node.js 24 compatible
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build EXE
        shell: pwsh
        run: ./build_windows_exe.ps1

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: DataTalk2Me
          path: dist/DataTalk2Me.exe
          if-no-files-found: error
          compression-level: 0
